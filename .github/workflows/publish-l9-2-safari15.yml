name: Publish L9.2 Safari 15 build

on:
  push:
    paths:
      - .github/workflows/publish-l9-2-safari15.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-abec-8211-bbd0-5743881d5679/raw?se=2026-08-28T09%3A04%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=f6e5d4b3-b1c6-55f8-ab97-91473a67013f&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T03%3A24%3A08Z&ske=2026-08-29T03%3A24%3A08Z&sks=b&skv=2026-02-06&sig=JEvNb6/Xv/Pek/n7qIbxGxpCD26lEkiDf1UmtEyv9L0%3D"
    steps:
      - uses: actions/checkout@v6
      - name: Replace branch with validated static artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location "$ARTIFACT_URL" --output /tmp/fragmentmove-pages.zip
          rm -rf /tmp/fragmentmove-pages
          mkdir -p /tmp/fragmentmove-pages
          unzip -q /tmp/fragmentmove-pages.zip -d /tmp/fragmentmove-pages

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/fragmentmove-pages/. .
          touch .nojekyll
          rm -rf .github

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy L9.2 Safari 15-compatible achievements"
          git push
