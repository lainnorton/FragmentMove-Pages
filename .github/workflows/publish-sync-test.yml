name: Publish sync and test isolation

on:
  push:
    paths:
      - .github/workflows/publish-sync-test.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Replace branch with validated static artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail 'https://sdmntprseasia.oaiusercontent.com/files/00000000-eb28-8207-a499-78617e82f170/raw?se=2026-08-29T15%3A08%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=50ca38ab-0c44-5ddd-82cd-3a66039d1280&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-29T01%3A33%3A14Z&ske=2026-08-30T01%3A33%3A14Z&sks=b&skv=2026-02-06&sig=PMaNV2dWmN3ymgaz65WWVLX5KjatqtivTr1QUdBK%2BYs%3D' -o /tmp/fragmentmove.zip
          rm -rf /tmp/fragmentmove-dist
          mkdir -p /tmp/fragmentmove-dist
          unzip -q /tmp/fragmentmove.zip -d /tmp/fragmentmove-dist
          test "$(tr -d '\r\n' < /tmp/fragmentmove-dist/source-commit.txt)" = "783850d3939525c43685293e687fcba1a018d59c"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/fragmentmove-dist/. .
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy sync and test isolation'
          git push
