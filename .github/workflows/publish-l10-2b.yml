name: Publish L10.2b curated seed build

on:
  push:
    paths:
      - .github/workflows/publish-l10-2b.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprwestus2.oaiusercontent.com/files/00000000-b3c4-81f8-98d8-bc75542236a9/raw?se=2026-08-28T12%3A49%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=a98b6536-d09e-56c1-a067-9880055609de&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T03%3A24%3A15Z&ske=2026-08-29T03%3A24%3A15Z&sks=b&skv=2026-02-06&sig=8VCS%2BzT30G0b8gF76MevATr/TftKYupQ/FA3sSHBFe4%3D"
    steps:
      - uses: actions/checkout@v6
      - name: Replace branch with validated static artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location "$ARTIFACT_URL" --output /tmp/fragmentmove-pages.zip
          rm -rf /tmp/fragmentmove-pages
          mkdir -p /tmp/fragmentmove-pages
          unzip -q /tmp/fragmentmove-pages.zip -d /tmp/fragmentmove-pages

          test "$(cat /tmp/fragmentmove-pages/source-commit.txt)" = "7cf0d05b75b02c8985ccd1d8a1022c35721dfb69"
          test -f /tmp/fragmentmove-pages/data/seed_videos_l10_2b.json
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/fragmentmove-pages/. .
          touch .nojekyll
          rm -rf .github

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy L10.2b curated video expansion"
          git push
