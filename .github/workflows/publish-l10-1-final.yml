name: Publish final L10.1 library audit build

on:
  push:
    paths:
      - .github/workflows/publish-l10-1-final.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprseasia.oaiusercontent.com/files/00000000-ebf0-8207-af63-7335d27880c5/raw?se=2026-08-28T11%3A04%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=d348c9e4-40fc-5d5e-a51a-ff4e91a4dc0a&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T03%3A20%3A08Z&ske=2026-08-29T03%3A20%3A08Z&sks=b&skv=2026-02-06&sig=G05RD2zk8Uq7sRSNvtk5U7AAm3GT/GMm/THcS6w5AhQ%3D"
    steps:
      - uses: actions/checkout@v6
      - name: Replace branch with validated static artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location "$ARTIFACT_URL" --output /tmp/fragmentmove-pages.zip
          rm -rf /tmp/fragmentmove-pages
          mkdir -p /tmp/fragmentmove-pages
          unzip -q /tmp/fragmentmove-pages.zip -d /tmp/fragmentmove-pages

          test "$(cat /tmp/fragmentmove-pages/source-commit.txt)" = "622e75d43f3e208b6f274568d686a08ae603200a"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/fragmentmove-pages/. .
          touch .nojekyll
          rm -rf .github

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy L10.1 video library audit final"
          git push
