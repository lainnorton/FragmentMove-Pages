name: Publish restored direct video flow

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-static-only.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Replace branch with validated static artifact
        run: |
          curl -L --fail 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-5cf4-81fb-b26a-576be4c23c80/raw?se=2026-08-28T07%3A11%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=4ee44acf-c238-549f-9275-dfa286ee33be&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T03%3A10%3A31Z&ske=2026-08-29T03%3A10%3A31Z&sks=b&skv=2026-02-06&sig=tL3I1oi3aiTUP4eK0t97ZP7VfxLnnIeVaGdwIXUYh6U%3D' -o /tmp/site.zip
          rm -rf /tmp/site && mkdir /tmp/site
          unzip -q /tmp/site.zip -d /tmp/site
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/site/. .
          touch .nojekyll
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy restored direct Bilibili flow"
          git push origin HEAD:main
