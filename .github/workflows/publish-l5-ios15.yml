name: Publish validated L5 iOS 15 artifact

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-l5-ios15.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Replace branch with validated static artifact
        env:
          ARTIFACT_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-d07c-8206-b0ee-9de62c8e72da/raw?se=2026-08-28T01%3A39%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=3624458f-8c66-51cc-8818-96083427eee1&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-27T22%3A18%3A32Z&ske=2026-08-28T22%3A18%3A32Z&sks=b&skv=2026-02-06&sig=DXb3xyNPhi6Y3KdZSNtyc64ckoMf4deCsCDDnjAuTjk%3D"
        run: |
          curl -fL "$ARTIFACT_URL" -o /tmp/site.zip
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/site.zip -d /tmp/site
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/site/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy L5 iOS 15 outbound bridge"
          git push origin HEAD:main
