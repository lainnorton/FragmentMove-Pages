name: Publish L11.1 verified reference fix

on:
  push:
    paths:
      - .github/workflows/publish-l11-1-reference-fix.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprseasia.oaiusercontent.com/files/00000000-fc2c-8207-a7b5-5df4f42847a5/raw?se=2026-08-29T08%3A09%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=1e1cb2c7-002c-5060-a065-c455d97aead7&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-29T02%3A07%3A44Z&ske=2026-08-30T02%3A07%3A44Z&sks=b&skv=2026-02-06&sig=yXPt/mBJR%2BHabaViNK4BRKRyRHckZ9EM05llH0GD7w4%3D"
    steps:
      - uses: actions/checkout@v6
      - name: Replace branch with validated static artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location "$ARTIFACT_URL" --output /tmp/fragmentmove-pages.zip
          rm -rf /tmp/fragmentmove-pages
          mkdir -p /tmp/fragmentmove-pages
          unzip -q /tmp/fragmentmove-pages.zip -d /tmp/fragmentmove-pages

          test "$(cat /tmp/fragmentmove-pages/source-commit.txt)" = "da7c5f538e7e9b29f854fcb86fd8a6d613b08c53"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/fragmentmove-pages/. .
          touch .nojekyll
          rm -rf .github

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy L11.1 verified exercise references"
          git push
