name: Publish L9.1 Spark Level build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-l9-1.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Replace branch with validated static artifact
        env:
          ARTIFACT_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-2f2c-81fd-851c-688b91ad1a25/raw?se=2026-08-28T08%3A39%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=5e5d0872-0764-5993-b15e-8c58eb0f50b9&skoid=b1bca990-dcac-4c31-8ca1-ac563cf24c54&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T03%3A22%3A05Z&ske=2026-08-29T03%3A22%3A05Z&sks=b&skv=2026-02-06&sig=htzfOqueGT0mbOed4P58pmgXRk/l%2BivMq31iMxIqbAI%3D"
        run: |
          set -euo pipefail
          rm -rf /tmp/fragmentmove-l9-1
          mkdir -p /tmp/fragmentmove-l9-1
          curl --fail --location "$ARTIFACT_URL" --output /tmp/fragmentmove-l9-1.zip
          unzip -q /tmp/fragmentmove-l9-1.zip -d /tmp/fragmentmove-l9-1
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/fragmentmove-l9-1/. .
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy L9.1 Spark Level"
          git push origin HEAD:main
