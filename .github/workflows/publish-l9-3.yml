name: Publish L9.3 Spark marks build

on:
  push:
    paths:
      - .github/workflows/publish-l9-3.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-e944-8209-94eb-4c1a8c2ba8fc/raw?se=2026-08-28T10%3A28%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=8af57530-1ab4-5f80-9e46-b24f630801c8&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T03%3A29%3A34Z&ske=2026-08-29T03%3A29%3A34Z&sks=b&skv=2026-02-06&sig=YvXrxmdLayozmEMEogVo9w%2BfPy60zb2oVs5R5PfJn0g%3D"
    steps:
      - uses: actions/checkout@v6
      - name: Replace branch with validated static artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location "$ARTIFACT_URL" --output /tmp/fragmentmove-pages.zip
          rm -rf /tmp/fragmentmove-pages
          mkdir -p /tmp/fragmentmove-pages
          unzip -q /tmp/fragmentmove-pages.zip -d /tmp/fragmentmove-pages

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/fragmentmove-pages/. .
          touch .nojekyll
          rm -rf .github

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy L9.3 Spark marks"
          git push
