name: Publish post-L11.2 UI polish

on:
  push:
    paths:
      - .github/workflows/publish-ui-polish.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-19a4-8206-89f4-c4c0c7bafb22/raw?se=2026-08-29T10%3A36%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=53c8f0de-e18a-5c5c-9098-6f7bc1846971&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-29T02%3A07%3A43Z&ske=2026-08-30T02%3A07%3A43Z&sks=b&skv=2026-02-06&sig=e5kmX4JC%2BZJA2yL05EOQImR3Eker4lYr71xd6iybzcE%3D"
    steps:
      - uses: actions/checkout@v6
      - name: Replace branch with validated static artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location "$ARTIFACT_URL" --output /tmp/fragmentmove-pages.zip
          rm -rf /tmp/fragmentmove-pages
          mkdir -p /tmp/fragmentmove-pages
          unzip -q /tmp/fragmentmove-pages.zip -d /tmp/fragmentmove-pages

          test "$(cat /tmp/fragmentmove-pages/source-commit.txt)" = "eec27d1afcfd6a1e5f631b014b336642923ff52d"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/fragmentmove-pages/. .
          touch .nojekyll
          rm -rf .github

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy post-L11.2 UI polish"
          git push
