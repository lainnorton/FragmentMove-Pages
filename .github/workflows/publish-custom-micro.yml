name: Publish custom micro moves

on:
  push:
    paths:
      - .github/workflows/publish-custom-micro.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Replace branch with validated static artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-8298-81f5-bc65-3fdd7999835b/raw?se=2026-08-30T11%3A34%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=20d26878-3243-5499-9819-9e3e87c4e00d&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-30T03%3A07%3A42Z&ske=2026-08-31T03%3A07%3A42Z&sks=b&skv=2026-02-06&sig=FAsWtmcYGH3g0y7oG5LeMcT%2BkEB6lLunwn1cW65LZg4%3D' -o /tmp/fragmentmove.zip
          rm -rf /tmp/fragmentmove-dist
          mkdir -p /tmp/fragmentmove-dist
          unzip -q /tmp/fragmentmove.zip -d /tmp/fragmentmove-dist
          test "$(tr -d '\r\n' < /tmp/fragmentmove-dist/source-commit.txt)" = "ccde5abef8951479e7a892f5d4e8e21446f97c14"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/fragmentmove-dist/. .
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy custom micro move library'
          git push
