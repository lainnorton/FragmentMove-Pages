name: Publish direct-tap shortcut diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-direct-tap.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Replace branch with validated static artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-bd30-820b-afe1-8b19d250c735/raw?se=2026-08-28T06%3A54%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=f4f61879-4cbf-50c8-9b6a-d3aedac1b132&skoid=f5e14fda-2af7-44a3-9d18-d372ffcad871&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T03%3A06%3A56Z&ske=2026-08-29T03%3A06%3A56Z&sks=b&skv=2026-02-06&sig=6UorFHKDJgEjQFQsaojc07kxC39lcW7V7sdvIYP/ZKw%3D' -o /tmp/site.zip
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/site.zip -d /tmp/site
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/site/. .
          touch .nojekyll
          rm -rf .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy direct-tap shortcut diagnostic'
          git push
