name: Publish L11.2 formal routine integration

on:
  push:
    paths:
      - .github/workflows/publish-l11-2.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-6bd4-8209-a49f-b295b599b3aa/raw?se=2026-08-29T08%3A37%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=5080502b-b08b-5e95-8eac-3707c2f7c2b1&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T22%3A47%3A08Z&ske=2026-08-29T22%3A47%3A08Z&sks=b&skv=2026-02-06&sig=N9jBKnpP6qwRgoYVA7wjhIsEa%2BeBN0v3ae3jrcQgi3M%3D"
    steps:
      - uses: actions/checkout@v6
      - name: Replace branch with validated static artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location "$ARTIFACT_URL" --output /tmp/fragmentmove-pages.zip
          rm -rf /tmp/fragmentmove-pages
          mkdir -p /tmp/fragmentmove-pages
          unzip -q /tmp/fragmentmove-pages.zip -d /tmp/fragmentmove-pages

          test "$(cat /tmp/fragmentmove-pages/source-commit.txt)" = "057609373942b39daae9b8d1adc6e10f4e8de37c"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/fragmentmove-pages/. .
          touch .nojekyll
          rm -rf .github

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy L11.2 formal routine integration"
          git push
