name: Publish L11.0 timer lab build

on:
  push:
    paths:
      - .github/workflows/publish-l11-0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-9e48-820b-a7ee-3c768022dae3/raw?se=2026-08-29T03%3A41%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=6115c8c0-7dac-588e-a8a1-9bef0c6a6f1d&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-29T00%3A44%3A47Z&ske=2026-08-30T00%3A44%3A47Z&sks=b&skv=2026-02-06&sig=Iet%2BJiZl1/HHSdjy/ttTRy75sIN5J0iAbt6b2ZneELg%3D"
    steps:
      - uses: actions/checkout@v6
      - name: Replace branch with validated static artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location "$ARTIFACT_URL" --output /tmp/fragmentmove-pages.zip
          rm -rf /tmp/fragmentmove-pages
          mkdir -p /tmp/fragmentmove-pages
          unzip -q /tmp/fragmentmove-pages.zip -d /tmp/fragmentmove-pages

          test "$(cat /tmp/fragmentmove-pages/source-commit.txt)" = "1fb332b910533b00e8e8a60e68da0dd2b240121c"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/fragmentmove-pages/. .
          touch .nojekyll
          rm -rf .github

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy L11.0 timer lab"
          git push
