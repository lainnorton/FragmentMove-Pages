name: Publish L11.1 micro routines build

on:
  push:
    paths:
      - .github/workflows/publish-l11-1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprjapaneast.oaiusercontent.com/files/00000000-2b38-8209-b50e-458854b354fb/raw?se=2026-08-29T07%3A27%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=3f7c2c77-3e9b-517e-b6a4-9a8b46775563&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-29T02%3A12%3A42Z&ske=2026-08-30T02%3A12%3A42Z&sks=b&skv=2026-02-06&sig=9YkYjR6suUMxXchLhl6eH%2BzVLg2/wTJHwcseD02tYiQ%3D"
    steps:
      - uses: actions/checkout@v6
      - name: Replace branch with validated static artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location "$ARTIFACT_URL" --output /tmp/fragmentmove-pages.zip
          rm -rf /tmp/fragmentmove-pages
          mkdir -p /tmp/fragmentmove-pages
          unzip -q /tmp/fragmentmove-pages.zip -d /tmp/fragmentmove-pages

          test "$(cat /tmp/fragmentmove-pages/source-commit.txt)" = "8653656123f4240e92c43082ded6e18bddbd4256"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/fragmentmove-pages/. .
          touch .nojekyll
          rm -rf .github

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy L11.1 micro routine preview"
          git push
