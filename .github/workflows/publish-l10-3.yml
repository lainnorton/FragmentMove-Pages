name: Publish L10.3 preference tuning

on:
  push:
    paths:
      - .github/workflows/publish-l10-3.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-49e4-81fa-b9e4-39fa164cac94/raw?se=2026-08-29T11%3A15%3A00Z&sp=r&sv=2026-02-06&sr=b&scid=a71b7d71-f161-564a-9b81-59e734843e07&skoid=bb372dd6-3b2a-4af2-b355-c26497ba23cd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-29T00%3A17%3A01Z&ske=2026-08-30T00%3A17%3A01Z&sks=b&skv=2026-02-06&sig=5UBf33alkKNbByoqZ2wHlUS7lEjIRLi12KnvOlOfg4k%3D"
    steps:
      - uses: actions/checkout@v6
      - name: Replace branch with validated static artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location "$ARTIFACT_URL" --output /tmp/fragmentmove-pages.zip
          rm -rf /tmp/fragmentmove-pages
          mkdir -p /tmp/fragmentmove-pages
          unzip -q /tmp/fragmentmove-pages.zip -d /tmp/fragmentmove-pages

          test "$(cat /tmp/fragmentmove-pages/source-commit.txt)" = "a0ed64c6092c30e33d80d373640508a65d57ff67"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/fragmentmove-pages/. .
          touch .nojekyll
          rm -rf .github

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy L10.3 personal preference tuning"
          git push
