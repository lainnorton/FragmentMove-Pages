name: Publish simplified L6 reminder bridge

on:
  push:
    paths:
      - '.github/workflows/publish-l6-simple.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Replace branch with validated static artifact
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          curl -fL 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-d700-8211-9bce-8e4c7da7a156/raw?se=2026-08-28T05%3A44%3A45Z&sp=r&sv=2026-02-06&sr=b&scid=13c8d040-8380-506c-8c90-56ecb2398030&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T03%3A21%3A58Z&ske=2026-08-29T03%3A21%3A58Z&sks=b&skv=2026-02-06&sig=jkBFDcJSd%2BH08XqodBxZljxpC/l5pw0T2bB7AeBw/0Q%3D' -o "$tmpdir/artifact.zip"
          mkdir "$tmpdir/dist"
          unzip -q "$tmpdir/artifact.zip" -d "$tmpdir/dist"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$tmpdir/dist/." .
          touch .nojekyll
          rm -rf .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy simplified L6 reminder bridge'
          git push origin HEAD:main
