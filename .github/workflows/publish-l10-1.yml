name: Publish L10.1 library audit build

on:
  push:
    paths:
      - .github/workflows/publish-l10-1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprcentralus.oaiusercontent.com/files/00000000-2590-81f5-838c-add270bf6e77/raw?se=2026-08-28T10%3A58%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=a3d5b20c-7485-5af6-bf7b-5e0d26531150&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T03%3A37%3A40Z&ske=2026-08-29T03%3A37%3A40Z&sks=b&skv=2026-02-06&sig=De5J3s/Vo%2BAl8wWMrgO55QnAGNOpKbhge/n1TwZYbTA%3D"
    steps:
      - uses: actions/checkout@v6
      - name: Replace branch with validated static artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location "$ARTIFACT_URL" --output /tmp/fragmentmove-pages.zip
          rm -rf /tmp/fragmentmove-pages
          mkdir -p /tmp/fragmentmove-pages
          unzip -q /tmp/fragmentmove-pages.zip -d /tmp/fragmentmove-pages

          test "$(cat /tmp/fragmentmove-pages/source-commit.txt)" = "f58fb8c036266510d7d50420df9c8b54b6777d42"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/fragmentmove-pages/. .
          touch .nojekyll
          rm -rf .github

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy L10.1 video library audit"
          git push
