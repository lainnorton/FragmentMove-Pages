name: Publish L9.2 achievements build

on:
  push:
    paths:
      - .github/workflows/publish-l9-2.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: "https://sdmntprseasia.oaiusercontent.com/files/00000000-9fa4-8207-85e4-e7e9b4dd6e04/raw?se=2026-08-28T09%3A00%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=96afec92-96ec-56f4-858a-7969d90456ef&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T03%3A53%3A13Z&ske=2026-08-29T03%3A53%3A13Z&sks=b&skv=2026-02-06&sig=yFYOyS0N/lt65/VETUgMqP6G7/hb0s%2BtubQgThoAX1I%3D"
    steps:
      - uses: actions/checkout@v6
      - name: Replace branch with validated static artifact
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location "$ARTIFACT_URL" --output /tmp/fragmentmove-pages.zip
          rm -rf /tmp/fragmentmove-pages
          mkdir -p /tmp/fragmentmove-pages
          unzip -q /tmp/fragmentmove-pages.zip -d /tmp/fragmentmove-pages

          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/fragmentmove-pages/. .
          touch .nojekyll
          rm -rf .github

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy L9.2 achievements and local reset"
          git push
