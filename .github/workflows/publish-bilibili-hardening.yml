name: Publish Bilibili launch hardening

on:
  push:
    paths:
      - .github/workflows/publish-bilibili-hardening.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Replace branch with validated static artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-e510-81f5-ab68-865516673270/raw?se=2026-09-08T03%3A07%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=c283c08e-3fb8-5309-ab71-81a2d58ee6c6&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-07T21%3A15%3A21Z&ske=2026-09-08T21%3A15%3A21Z&sks=b&skv=2026-02-06&sig=sKf%2BG3xEADnqe3Sv6uXxBINnEHLNNSxzT2u8JMfFHGs%3D' -o /tmp/fragmentmove.zip
          rm -rf /tmp/fragmentmove-dist
          mkdir -p /tmp/fragmentmove-dist
          unzip -q /tmp/fragmentmove.zip -d /tmp/fragmentmove-dist
          test "$(tr -d '\r\n' < /tmp/fragmentmove-dist/source-commit.txt)" = "2a1a3d2535c9881711e39a675e65b37efed9e7d7"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/fragmentmove-dist/. .
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy Bilibili launch hardening'
          git push
