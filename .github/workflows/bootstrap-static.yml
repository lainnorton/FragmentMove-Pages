name: Bootstrap FragmentMove static site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-static.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public deploy repository
        uses: actions/checkout@v6

      - name: Download validated static artifact
        run: |
          curl --fail --location 'https://sdmntprseasia.oaiusercontent.com/files/00000000-c928-8207-b4c5-4144e86437f9/raw?se=2026-08-27T10%3A38%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=624a9e77-4c67-5cb9-8b23-aea42b187b8f&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-27T03%3A16%3A48Z&ske=2026-08-28T03%3A16%3A48Z&sks=b&skv=2026-02-06&sig=wetocqpfAFoDbIEHXv9Q66fRkVwHacHFAkFTnPfvZ9Y%3D' --output /tmp/fragmentmove-pages-dist.zip
          rm -rf /tmp/fragmentmove-site
          mkdir -p /tmp/fragmentmove-site
          unzip -q /tmp/fragmentmove-pages-dist.zip -d /tmp/fragmentmove-site

      - name: Replace repository with deploy-only files
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/fragmentmove-site/. .
          touch .nojekyll
          rm -rf .github

      - name: Commit static site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy validated FragmentMove static artifact'
          git push origin HEAD:main
