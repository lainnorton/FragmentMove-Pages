name: Publish validated L5 artifact

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-l5.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download validated private artifact
        run: |
          curl -fL 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-8b10-8211-8c36-7f842edd22bc/raw?se=2026-08-27T13%3A06%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=c19bb0dd-28d3-500a-8a4e-b57aa74cb147&skoid=0b778285-7b0b-4cdc-ac3b-fb93e8c3686f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-27T03%3A56%3A56Z&ske=2026-08-28T03%3A56%3A56Z&sks=b&skv=2026-02-06&sig=UxifyV8gv8UJDgUZN6m8Xwx7/V1qWX%2BsPpVxiBw7HO0%3D' -o /tmp/fragmentmove-pages.zip
          mkdir -p /tmp/fragmentmove-pages
          unzip -q /tmp/fragmentmove-pages.zip -d /tmp/fragmentmove-pages

      - name: Replace deploy-only tree
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R /tmp/fragmentmove-pages/. .
          touch .nojekyll
          test -f index.html
          test -f service-worker.js
          test -f manifest.webmanifest
          test -f source-commit.txt
          grep -qx 'd41944c81655831d43f33ea895775de638442fcd' source-commit.txt

      - name: Commit validated L5 artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy L5 Shortcuts bridge'
          git push origin main
